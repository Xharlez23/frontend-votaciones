<div class="contenedor">
  <h1>Selecciona tu candidato</h1>
  <p class="jornada-label">Jornada: {{ jornada }}</p>

  <div *ngIf="cargando" class="cargando">
    <mat-spinner></mat-spinner>
  </div>

  <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

  <div class="grid-candidatos" *ngIf="!cargando">
    <mat-card
      *ngFor="let candidato of candidatos"
      class="tarjeta-candidato"
      [class.seleccionado]="candidatoSeleccionado === candidato.id"
      (click)="seleccionar(candidato.id)">
      <mat-card-content>
        <h3>{{ candidato.nombre }}</h3>
        <p>Ficha: {{ candidato.ficha }}</p>
      </mat-card-content>
    </mat-card>
  </div>

  <button
    mat-raised-button
    color="primary"
    class="boton-votar"
    [disabled]="!candidatoSeleccionado || enviandoVoto"
    (click)="confirmarVoto()">
    {{ enviandoVoto ? 'Enviando voto...' : 'Confirmar voto' }}
  </button>
</div>
